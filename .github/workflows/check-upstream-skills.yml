name: Check upstream skills

on:
  pull_request:
    paths:
      - catalog.json
      - licenses/**
      - scripts/**
      - tests/**
      - skills/**
      - .github/workflows/check-upstream-skills.yml
  push:
    branches: [main]
    paths:
      - catalog.json
      - licenses/**
      - scripts/**
      - tests/**
      - skills/**
      - .github/workflows/check-upstream-skills.yml
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: Only adopt upstream commits at least this many days old
        required: false
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the pinned skill catalog
        run: |
          python -m unittest discover -s tests -v
          python scripts/update_skills.py --check
          git diff --check -- . ':(exclude)licenses/**' ':(exclude)skills/**'
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: Verify upstream content matches its pinned commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_skills.py --verify-pins

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MIN_AGE_DAYS: ${{ inputs.min_age_days || '7' }}
      RUN_LABEL: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prepare the automation identity
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Close pull requests from the previous update flow
        run: |
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/upstream-skills-")) | .number' |
          while read -r number; do
            gh pr close "$number" --delete-branch \
              --comment "Superseded: upstream updates now merge automatically when their checks pass."
          done
      - name: Apply updates that pass the automatic checks
        run: >-
          python scripts/update_skills.py --min-age-days "$MIN_AGE_DAYS"
          --only clean --report "$RUNNER_TEMP/clean.json"
      - name: Verify and merge them
        run: |
          if [ "$(jq '.written | length' "$RUNNER_TEMP/clean.json")" -eq 0 ]; then
            echo "No updates to merge automatically."
            exit 0
          fi
          python -m unittest discover -s tests -v
          python scripts/update_skills.py --check
          python scripts/update_skills.py --verify-pins
          git diff --check -- . ':(exclude)licenses/**' ':(exclude)skills/**'
          branch="automation/upstream-updates-$RUN_LABEL"
          git switch -c "$branch"
          git add catalog.json licenses/ skills/
          git commit -m "chore: update upstream skills"
          git push origin "$branch"
          jq -r '"Merged automatically after tests, pin verification, and policy checks passed.\n\n"
            + ([.clean | to_entries[] | "- `\(.key)` → `\(.value.ref)`: \(.value.skills | join(", "))"]
            | join("\n"))' "$RUNNER_TEMP/clean.json" > "$RUNNER_TEMP/clean.md"
          gh pr create --base main --head "$branch" --title "Update upstream skills" \
            --body-file "$RUNNER_TEMP/clean.md"
          for attempt in 1 2 3; do
            if gh pr merge "$branch" --squash --delete-branch; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Propose updates that need review
        run: |
          if [ "$(jq '.review | length' "$RUNNER_TEMP/clean.json")" -eq 0 ]; then
            echo "No updates need review."
            exit 0
          fi
          git fetch origin main
          git switch --force-create review-work origin/main
          python scripts/update_skills.py --min-age-days "$MIN_AGE_DAYS" \
            --only review --report "$RUNNER_TEMP/review.json"
          if [ "$(jq '.written | length' "$RUNNER_TEMP/review.json")" -eq 0 ]; then
            echo "Nothing left to review."
            exit 0
          fi
          python scripts/update_skills.py --check
          digest="$(jq -cS .review "$RUNNER_TEMP/review.json" | sha256sum | cut -c1-12)"
          branch="automation/upstream-review-$digest"
          if [ "$(gh pr list --state all --head "$branch" --json number --jq length)" -gt 0 ]; then
            echo "This exact update was already proposed on $branch."
            exit 0
          fi
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/upstream-review-")) | .number' |
          while read -r number; do
            gh pr close "$number" --delete-branch --comment "Superseded by a newer upstream review."
          done
          git switch -c "$branch"
          git add catalog.json licenses/ skills/
          git commit -m "chore: propose upstream skill updates for review"
          git push origin "$branch"
          jq -r '"These upstream updates change scripts, executable files, licenses, invocation"
            + " behavior, or rewritten history, so they need your review.\n\n"
            + ([.review | to_entries[] | "- `\(.key)` → `\(.value.ref)`\n"
              + (.value.reasons | map("  - " + .) | join("\n"))] | join("\n"))
            + "\n\nMerge to accept. Close to reject this exact update; it will not be proposed again."' \
            "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/review.md"
          gh pr create --draft --base main --head "$branch" \
            --title "Review upstream skill updates" --body-file "$RUNNER_TEMP/review.md"
